[package]
name = "mqtt-bridge-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The Bridge Runtime's conformance suite: the Store's side over MQTT (FakeBroker) against a scriptable fake device"
license = "MIT"
repository = "https://github.com/yuvalrakavy/tracing-init"
publish = false

[dependencies]
bytes = "1"
jsonschema = { version = "0.33", default-features = false }
mqtt-bridge-kit = { path = "../mqtt-bridge-kit", features = ["test-seams"] }
mqtt-test-broker = { path = "../mqtt-test-broker" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-core = "0.1"

[[bin]]
name = "fake-bridge"
path = "src/bin/fake-bridge.rs"

[[bin]]
name = "fake-host"
path = "src/bin/fake-host.rs"

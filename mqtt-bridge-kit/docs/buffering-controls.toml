# New controls for opt-in MQTT buffering. Existing control tables are plan-checked.
[[control]]
name = "reply_overflow_cannot_interrupt_a_blocked_publish"
file = "mqtt-bridge-kit/src/session.rs"
anchor = "() = crate::buffering::overflowed(buffers.clone()) => Ok(Some(SessionEnd::Ended { connected: None })),"
replacement = "// faulty: overflow waits behind the in-progress publish"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(reply_exhaustion_interrupts_publication_blocked)"]
expect_text = "reply overflow waited behind a blocked MQTT publish"

[[control]]
name = "buffer_limits_are_not_wired_into_the_launched_session"
file = "mqtt-bridge-kit/src/host.rs"
anchor = "buffers: self.buffers.map(crate::buffering::Buffers::new),"
replacement = "buffers: None,"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(incoming_budget_exhaustion)"]
expect_text = "incoming budget exhaustion did not retry the MQTT connection"

[[control]]
name = "incoming_accounting_checks_only_individual_messages"
file = "mqtt-bridge-kit/src/buffering.rs"
anchor = "if next > self.limit {"
replacement = "if bytes > self.limit {"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(unread_pump_publications)"]
expect_text = "many small unread publishes escaped the aggregate incoming budget"

[[control]]
name = "byte_accounting_wraps_on_addition"
file = "mqtt-bridge-kit/src/buffering.rs"
anchor = "let next = used.checked_add(bytes)?;"
replacement = "let next = used.wrapping_add(bytes);"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(byte_reservation_rejects_overflow)"]
expect_text = "byte accounting wrapped past its ceiling"

[[control]]
name = "incoming_budget_ignores_decoded_user_property_storage"

[[control]]
name = "cloned_builders_share_their_live_buffer_coordinator"
file = "mqtt-bridge-kit/src/host.rs"
anchor = "buffers: self.buffers.map(crate::buffering::Buffers::new),"
replacement = '''buffers: self.buffers.map(|limits| {
                static SHARED: std::sync::OnceLock<std::sync::Arc<crate::buffering::Buffers>> = std::sync::OnceLock::new();
                SHARED.get_or_init(|| crate::buffering::Buffers::new(limits)).clone()
            }),'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(cloned_builders_do_not_share_buffer_exhaustion)"]
expect_text = "another bridge's buffering state prevented a healthy reply"

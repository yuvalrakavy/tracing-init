[[control]]
name = "public_packet_setting_not_passed_to_session"
guard = "public packet policy wiring"
file = "mqtt-bridge-kit/src/host.rs"
anchor = 'packet_limits: self.packet_limits,'
replacement = 'packet_limits: false,'
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(public_packet_policy)"]
expect_text = "public packet policy was ignored"

[[control]]
name = "bootstrap_fault_does_not_clear_stale_active"
guard = "fault clears stale online status"
file = "mqtt-bridge-kit/src/lifecycle.rs"
anchor = 'session::emit(ctx, self.shared.topics.active(), true, b"false".to_vec(), session::properties()).await;'
replacement = ''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(a_bootstrap_packet_fault)"]
expect_text = "bootstrap size fault left stale Active=true retained"

[[control]]
name = "ordinary_output_packet_admission_omitted"
guard = "queued output admission"
file = "mqtt-bridge-kit/src/session.rs"
anchor = 'if (shared.packet_limits || out.publication.is_some()) && !packet_admitted(&out.topic, &out.payload, &out.properties, maximum) {'
replacement = 'if false {'
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(every_output_lane_refuses)"]
expect_text = "an oversized output blocked following state"

[[control]]
name = "lifecycle_packet_admission_omitted"
guard = "lifecycle output admission"
file = "mqtt-bridge-kit/src/session.rs"
anchor = 'if ctx.shared.packet_limits && !packet_admitted(&topic, &payload, &properties, ctx.line.maximum_packet_size() as usize) {'
replacement = 'if false {'
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(lifecycle_publications_check)"]

[[control]]
name = "packet_size_omits_qos_one_identifier"
guard = "complete MQTT packet bytes"
file = "mqtt-bridge-kit/src/session.rs"
anchor = 'packet.pkid = 1;'
replacement = 'packet.pkid = 0;'
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(packet_accounting_matches)"]
expect_text = "packet size omitted a header/property byte"

[[control]]
name = "local_packet_ceiling_not_applied"
guard = "local and peer minimum"
file = "mqtt-bridge-kit/src/session.rs"
anchor = 'let maximum = maximum.min(MAX_PACKET_SIZE as usize);'
replacement = 'let maximum = maximum;'
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(packet_accounting_matches)"]
expect_text = "assertion failed: packet_admitted"

[[control]]
name = "control_packet_admission_omitted"
guard = "subscription control admission"
file = "mqtt-bridge-kit/src/lifecycle.rs"
anchor = 'if ctx.shared.packet_limits && size > maximum {'
replacement = 'if false {'
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(oversized_subscription)"]

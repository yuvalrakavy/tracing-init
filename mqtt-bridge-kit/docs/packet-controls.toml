[[control]]
name = "packet_fault_keeps_expired_timers_armed"
guard = "fault does not spin or reconnect"
file = "mqtt-bridge-kit/src/lifecycle.rs"
anchor = '''    pub(crate) fn next_wake(&self) -> Option<Instant> {
        if self.conn.packet_fault {
            return None;
        }'''
replacement = '''    pub(crate) fn next_wake(&self) -> Option<Instant> {'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(oversized_subscription)"]
expect_text = "packet fault retained a reconnect or spinning timer"

[[control]]
name = "oversized_first_publication_keeps_its_barrier"
guard = "refusal releases publication barrier"
file = "mqtt-bridge-kit/src/session.rs"
anchor = 'self.firsts -= usize::from(out.first);'
replacement = ''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(packet_refusal_releases)"]
expect_text = "packet refusal stranded the first-publication barrier"

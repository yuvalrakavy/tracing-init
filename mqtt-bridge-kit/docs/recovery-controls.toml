# Recovery handshake and exact replacement prerequisites; snapshot publication is separate.
[[control]]
name = "recovery_refusal_drops_its_correlated_reply"
file = "mqtt-bridge-kit/src/lifecycle.rs"
anchor = '''if let Ok(Some(reply)) = ReplyTo::from_properties(publish.properties.as_ref(), &device.topics) {
                            let (target, command) = wire::command_names(&publish.payload);'''
replacement = '''if let Ok(Some(reply)) = ReplyTo::from_properties(publish.properties.as_ref(), &device.topics).map(|_| None::<ReplyTo>) {
                            let (target, command) = wire::command_names(&publish.payload);'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(recovery_only_refusals_answer_correlated_callers_and_do_not_run_builtin_refresh)"]
expect_text = "recovery refusal did not answer its correlated caller"

[[control]]
name = "builtin_refresh_bypasses_recovery_only_admission"
file = "mqtt-bridge-kit/src/lifecycle.rs"
anchor = '''target.is_none()
                                    && call.command != "refresh"
                                    && call.command != "assume"
                                    && device
                                        .commands
                                        .get()
                                        .is_some_and(|commands| commands.iter().any(|command| command.name == call.command))'''
replacement = "target.is_none()"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(recovery_only_refusals_answer_correlated_callers_and_do_not_run_builtin_refresh)"]
expect_text = "a builtin refresh bypassed recovery-only admission"


[[control]]
name = "managed_starts_reuse_a_shared_recovery_owner"
file = "mqtt-bridge-kit/src/process.rs"
anchor = "self.0.recovery_shared = self.0.recovery.clone().map(crate::recovery::RecoveryShared::new).transpose()?;"
replacement = '''self.0.recovery_shared = self.0.recovery.clone().map(|options| {
            static SHARED: std::sync::OnceLock<std::sync::Arc<crate::recovery::RecoveryShared>> = std::sync::OnceLock::new();
            SHARED.get_or_init(|| crate::recovery::RecoveryShared::new(options).unwrap()).clone()
        });'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(cloned_bridge_builders_get_separate_recovery_owners_and_cannot_install_each_others_images)"]

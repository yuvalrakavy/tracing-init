[[control]]
name = "snapshot_grant_bypasses_the_separate_barrier_ack"
file = "mqtt-bridge-kit/src/lifecycle.rs"
anchor = '''Purpose::RecoveryBarrier(connection),
                        vec![Self::filter(bootstrap.barrier.clone(), false)],
                    )
                    .await?;'''
replacement = '''Purpose::RecoveryBarrier(connection),
                        vec![Self::filter(bootstrap.barrier.clone(), false)],
                    ).await?;
                    let document = self.recovery_bootstrap.as_ref().unwrap().document.clone();
                    self.recovery.as_ref().unwrap().readback_result(connection, document)?;'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(every_connection_needs_its_own_barrier_and_install_before_state_or_ordinary_requests)"]
expect_text = "snapshot subscription alone completed recovery replay"


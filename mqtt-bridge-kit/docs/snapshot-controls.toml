# Snapshot publication through the existing runtime, not a second MQTT client.
[[control]]
name = "installed_snapshot_is_not_selected_for_publication"
file = "mqtt-bridge-kit/src/recovery.rs"
anchor = "state.publication.reset(install.image.snapshot.clone());"
replacement = "state.publication.reset(None);"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(snapshots_publish_through_the_runtime)"]
expect_text = "the installed snapshot never reached the existing runtime publisher"

[[control]]
name = "snapshot_identity_reuses_revision"
file = "mqtt-bridge-kit/src/recovery/publication.rs"
anchor = "Ok(Self { id, revision, document, context })"
replacement = "let _ = id; Ok(Self { id: revision, revision, document, context })"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(snapshot_identity_is_not_its_revision)"]
expect_text = "equal revisions reused snapshot identity"

[[control]]
name = "pending_snapshot_keeps_the_first_update"
file = "mqtt-bridge-kit/src/recovery/publication.rs"
anchor = "state.publication.pending = Some(snapshot);"
replacement = "if state.publication.pending.is_none() { state.publication.pending = Some(snapshot); }"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "-E", "test(publication_is_current_ready_only)"]
expect_text = "assertion `left == right` failed"

[[control]]

[package]
name = "mqtt-bridge-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The Bridge Runtime: one runtime owns every MQTT device bridge's policy (pump, outages, mailbox, reports, replies, process); a bridge implements a DeviceDriver"
license = "MIT"
repository = "https://github.com/yuvalrakavy/tracing-init"
publish = false

[dependencies]
bytes = "1"
lock-order = { path = "../lock-order" }
rumqttc = { version = "0.25", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-init = { path = "..", features = ["otel"] }

[dev-dependencies]
mqtt-test-broker = { path = "../mqtt-test-broker" }
wait-lint = { path = "../wait-lint" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-core = "0.1"

[package]
name = "wait-lint"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Every place a server waits on something else names the registry row that says why the wait cannot join a wait-for cycle, or what bounds it"
license = "MIT"
repository = "https://github.com/yuvalrakavy/tracing-init"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

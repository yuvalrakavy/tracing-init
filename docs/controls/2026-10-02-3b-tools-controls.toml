# wait-lint: an imported function's name (C-16), the crate's own name, the empty scan (C-18).

[[control]]
name        = "an_imported_function_is_read_as_this_codes"
file        = "wait-lint/src/scan.rs"
# Since T3, a call is also followed through the modules' `use`s (`reach`), which reads the file's
# own import too: the mutation drops both readings, as the original defect had neither.
anchor      = '''        if reach.contains(&Reach::Outside) {
            return Callee::Foreign;
        }
        if let Some(readings) = self.uses.readings(path) {
            return if readings.iter().all(|r| self.names.is_local_fn(r)) { Callee::Local } else { Callee::Foreign };'''
replacement = '''        if let Some(readings) = None::<Vec<Vec<String>>> {
            return if readings.iter().all(|r| self.names.is_local_fn(r)) { Callee::Local } else { Callee::Foreign };'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "wait-lint/Cargo.toml", "--lib", "--", "an_imported_function_named_like"]
expect_text = "the imported `publish` is a wait"
guard       = "collision_imported_fn"

[[control]]
name        = "a_name_a_dependency_s_glob_may_hold_is_this_codes"
file        = "wait-lint/src/scan.rs"
anchor      = '''        if path.len() == 1 && !self.uses.fns.contains(&path[0]) && self.uses.globs_outside(self.names) {
            return Callee::Ambiguous;'''
replacement = '''        if path.len() == 1 && !self.uses.fns.contains(&path[0]) && self.uses.globs_outside(self.names) {
            return Callee::Local;'''
target      = "command"

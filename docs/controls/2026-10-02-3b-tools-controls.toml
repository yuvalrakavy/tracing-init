# --- The re-review's fixes (T1..T4) ---------------------------------------------------------

# T1: the ack-race test waits until the acker has reached the `held` lock, not 100 ms. The row
# above (`an_ack_is_decided_before_the_held_lock`) is the prompt acker; this one is a slow one,
# which the 100 ms sleep let read the flag after the release (GREEN on the old test).

[[control]]
name        = "a_slow_ack_is_decided_before_the_held_lock"
file        = "mqtt-test-broker/src/lib.rs"
anchor      = '''    let mut held = lock_held(shared);
    if shared.hold_acks.load(Ordering::SeqCst) {
        held.push(pkid);'''
replacement = '''    std::thread::sleep(std::time::Duration::from_millis(300));
    let holding = shared.hold_acks.load(Ordering::SeqCst);

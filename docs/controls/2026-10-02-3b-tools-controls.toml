# lock-order: the Condvar (C-M3 / X-8, X-4 / C-11, C-22).

[[control]]
name        = "the_condvar_checks_the_reacquisition_after_the_wait"
file        = "lock-order/src/sync.rs"
anchor      = '''        let (inner, class, instance) = release_for_wait(guard, site);
        map_lock(self.inner.wait(inner), |g| MutexGuard::new(g, class, instance, site))'''
replacement = '''        let MutexGuard { _held, inner, class, instance } = guard;
        drop(_held);
        let woke = self.inner.wait(inner);
        hooks::attempt(class, instance, site);
        map_lock(woke, |g| MutexGuard::new(g, class, instance, site))'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--lib", "--", "a_blocked_reacquisition_is_on_record"]
expect_text = "the re-acquisition's order was not checked before the wait"
guard       = "condvar_check_precedes_wait"

[[control]]
name        = "a_poisoned_wake_leaves_the_record_behind"
file        = "lock-order/src/sync.rs"
anchor      = '''        map_lock(self.inner.wait(inner), |g| MutexGuard::new(g, class, instance, site))'''
replacement = '''        match self.inner.wait(inner) {
            Ok(g) => Ok(MutexGuard::new(g, class, instance, site)),
            Err(p) => {
                let g = MutexGuard::new(p.into_inner(), class, instance, site);
                hooks::released(&g._held.0);
                Err(PoisonError::new(g))
            }
        }'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--lib", "--", "a_poisoned_wake_takes_the_class_back"]
expect_text = "a poisoned wake left the waiter without its record"
guard       = "condvar_poisoned_restore"

[[control]]
name        = "the_wait_while_predicate_runs_without_the_record"
file        = "lock-order/src/sync.rs"
anchor      = '''        while condition(&mut *guard) {
            guard = self.wait(guard)?;
        }
        Ok(guard)'''
replacement = '''        let site = Location::caller();
        let (inner, class, instance) = release_for_wait(guard, site);
        map_lock(self.inner.wait_while(inner, condition), |g| MutexGuard::new(g, class, instance, site))'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--lib", "--", "a_wait_while_predicate_runs_holding"]
expect_text = "the predicate ran without the guard's record (before the wait, after the wake)"
guard       = "condvar_wait_while_predicate"

[[control]]
name        = "the_wait_timeout_while_predicate_runs_without_the_record"
file        = "lock-order/src/sync.rs"
anchor      = '''        let start = Instant::now();
        loop {
            if !condition(&mut *guard) {
                return Ok((guard, wait_result(false)));
            }
            let Some(left) = dur.checked_sub(start.elapsed()) else {
                return Ok((guard, wait_result(true)));
            };
            guard = self.wait_timeout(guard, left)?.0;
        }'''
replacement = '''        let site = Location::caller();
        let (inner, class, instance) = release_for_wait(guard, site);
        map_lock(self.inner.wait_timeout_while(inner, dur, condition), |(g, t)| (MutexGuard::new(g, class, instance, site), t))'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--lib", "--", "a_wait_timeout_while_predicate_runs_holding"]
expect_text = "the predicate ran without the guard's record: ["
guard       = "condvar_wait_timeout_while_predicate"

[[control]]
name        = "the_wait_timeout_while_bound_restarts_at_each_wake"
file        = "lock-order/src/sync.rs"
anchor      = '''        let start = Instant::now();
        loop {
            if !condition(&mut *guard) {
                return Ok((guard, wait_result(false)));
            }
            let Some(left) = dur.checked_sub(start.elapsed()) else {
                return Ok((guard, wait_result(true)));
            };
            guard = self.wait_timeout(guard, left)?.0;
        }'''
replacement = '''        loop {
            if !condition(&mut *guard) {
                return Ok((guard, wait_result(false)));
            }
            let (g, result) = self.wait_timeout(guard, dur)?;
            guard = g;
            if result.timed_out() && condition(&mut *guard) {
                return Ok((guard, result));
            }
        }'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--lib", "--", "a_wait_timeout_while_keeps_its_bound"]
expect_text = "the bound restarted at each wake"
guard       = "condvar_wait_timeout_while_bound"


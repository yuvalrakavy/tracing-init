# Negative controls for the phase-3b tool changes (Store no-hang §14.2): wait-lint's name
# collision, empty scan and raw-lock escapes; lock-order's Condvar; the fake broker. The rows
# after the first ten are the 3b review's fix pass (findings C-12..C-22, C-M3, X-4, X-7, X-8,
# X-10); the rows at the end are the re-review's (T1..T4). Run from Store with
#     CARGO_TARGET_DIR=<a scratch dir> scripts/negative-control.py --root ../tracing-init ../tracing-init/docs/controls/2026-10-02-3b-tools-controls.toml
# The scratch target dir matters: a row that builds wait-lint's binary (`--test cli`) builds it
# from the mutant, and other sessions run `wait-lint/target/debug/wait-lint --write`.

[[control]]
name        = "the_condvar_checks_nothing_before_the_wait"
file        = "lock-order/src/sync.rs"
anchor      = '''    drop(_held);
    hooks::attempt(class, instance, site);
'''
replacement = '''    drop(_held);
'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--", "reports_the_reacquisitions_cycle"]
expect_text = "the re-acquisition's order was not checked before the wait"
guard       = "condvar_prewait_check"

[[control]]
name        = "the_condvar_keeps_its_record_through_the_wait"
file        = "lock-order/src/sync.rs"
anchor      = '''    drop(_held);
    hooks::attempt(class, instance, site);
'''
replacement = '''    std::mem::forget(_held);
    hooks::attempt(class, instance, site);
'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "lock-order/Cargo.toml", "--", "gives_up_its_class_and_takes_it_back"]
expect_text = "the waiter kept its record through the wait"
guard       = "condvar_release"


[[control]]
name        = "a_scan_that_found_no_wait_is_green"
file        = "wait-lint/src/lib.rs"
anchor      = '''        report.files_scanned > 0 && !report.sites.is_empty(),'''
replacement = '''        report.files_scanned > 0,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "wait-lint/Cargo.toml", "--lib", "--", "refuses_a_scan_that_found_no_wait"]
expect_text = "assert_registered_refuses_a_scan_that_found_no_wait"
guard       = "empty_scan_no_wait"

[[control]]
name        = "the_cli_passes_a_scan_that_found_no_wait"
file        = "wait-lint/src/main.rs"
anchor      = '''    if mode == "check" && (report.files_scanned == 0 || report.sites.is_empty()) {'''
replacement = '''    if mode == "check" && report.files_scanned == 0 {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "wait-lint/Cargo.toml", "--test", "cli"]
expect_text = "a scan that read files but found no wait must fail"
guard       = "cli_empty_scan"

# mqtt-test-broker: the hold/release race (X-7 / C-20), dropping the broker (C-19).

[[control]]
name        = "an_ack_is_decided_before_the_held_lock"
file        = "mqtt-test-broker/src/lib.rs"
anchor      = '''    let mut held = shared.held.lock().unwrap();
    if shared.hold_acks.load(Ordering::SeqCst) {
        held.push(pkid);'''
replacement = '''    let holding = shared.hold_acks.load(Ordering::SeqCst);
    let mut held = shared.held.lock().unwrap();
    if holding {
        held.push(pkid);'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-test-broker/Cargo.toml", "--lib", "--", "an_ack_decided_during_a_release"]
expect_text = "an ack decided during a release was stranded"
guard       = "fake_broker_ack_race"

[[control]]
name        = "a_dropped_broker_keeps_its_connections"
file        = "mqtt-test-broker/src/lib.rs"
anchor      = '''        connections.spawn(connection(stream, shared.clone()));'''
replacement = '''        drop(tokio::spawn(connection(stream, shared.clone())));
        connections.spawn(async {});'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-test-broker/Cargo.toml", "--lib", "--", "dropping_the_broker_closes"]
expect_text = "the broker was dropped but its connection still holds the client's socket open"
guard       = "fake_broker_drop_connections"

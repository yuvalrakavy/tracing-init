# ---- The adversarial review's findings (M1-M3, minor 2) ------------------------------------------

# M1: a runtime leaving the rotation hands its answers to the outbox. (A unit test: which reports
# are still in the slot at retirement is a race end to end, and the scenario never entered it.)
[[control]]
name        = "a_retired_runtimes_answers_go_with_it"
file        = "mqtt-bridge-kit/src/lifecycle.rs"
anchor      = '''    if connected {
        for out in answers {'''
replacement = '''    if connected && answers.is_empty() && unsolicited.is_empty() {
        for out in answers {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "--", "lifecycle::tests::a_retired_runtimes_answers_go_to_the_outbox", "--exact"]
expect_text = '''a retired runtime's answer and unsolicited report went with it'''
guard       = "retired_answers_kept"

# M2: a stop that ends disabled (or deleted) reads its slot on a newer connection.
[[control]]
name        = "a_stop_across_a_reconnect_reads_nothing"
file        = "mqtt-bridge-kit/src/lifecycle.rs"
anchor      = '''                Some(Phase::Live | Phase::Disabled | Phase::Stopping { then: Then::Disable | Then::Release { cleanup: true }, .. })'''
replacement = '''                Some(Phase::Live | Phase::Disabled)'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "host_lifecycle", "--", "a_disable_that_spans_a_reconnect_keeps_its_read_back", "--exact"]
expect_text = '''the disabled instance did not subscribe its read-back on the new connection'''
guard       = "stopping_reads_on_connack"

# M3: a delete that ends offline keeps its cleanup pending...
[[control]]
name        = "an_offline_deletes_cleanup_is_forgotten"
file        = "mqtt-bridge-kit/src/lifecycle.rs"
anchor      = '''                        self.cleanups.insert(name.to_owned(), own);'''
replacement = '''                        let _ = own;'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "host_lifecycle", "--", "a_delete_finished_while_disconnected_is_cleared_after_the_reconnect", "--exact"]
expect_text = '''a delete that ended while disconnected left its tagged topics behind'''
guard       = "cleanup_pending_kept"

# ...and hands it over at the next root replay.
[[control]]
name        = "a_pending_cleanup_is_never_handed_over"
file        = "mqtt-bridge-kit/src/lifecycle.rs"
anchor      = '''                self.hand_over_cleanups(outputs);'''

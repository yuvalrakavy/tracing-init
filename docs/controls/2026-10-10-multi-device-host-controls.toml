# Negative controls for the multi-device host, R2 (tracing-init `mqtt-bridge-kit`, its conformance
# suite and the fake broker's additions; multi-device spec
# `docs/superpowers/specs/2026-10-10-multi-device-host-design.md` §3, §4, §7). Each row undoes one
# guard and names the test that must fail, by its failure text. Run from the repository root with
#     CARGO_TARGET_DIR=<a scratch dir> python3 <Store>/scripts/negative-control.py \
#         --root . docs/controls/2026-10-10-multi-device-host-controls.toml
# Every row must come back RED. R1's own rows stay in 2026-10-04-bridge-runtime-controls.toml (the
# rows whose code R2 moved are re-anchored there).
#
# Runs (2026-10-10). The rows were run in batches as they were written (`--row`), and after each
# fix round with `--touched <the round's base>`. The whole table at c8d08e4: 59 rows, 54 RED,
# 3 GREEN, 2 WRONG-REASON. GREEN: `the_pump_drops_the_unsuback` (the cleanup came all the same
# after the grant bound ended the session; the scenario now asserts no `subscription_refused`),
# `an_overdue_grant_goes_on` (the pump's stall bound, twice the 5 s keep-alive, ended the session at
# the same 10 s; the scenario now runs a 30 s keep-alive), `a_retired_runtimes_answers_go_with_it`
# (no scenario enters a retirement with reports still in the slot; a unit test now does).
# WRONG-REASON: `a_devices_reports_wake_nobody` and `a_configured_instances_state_is_untagged`, red
# on an earlier assertion that sees the same guard; their expected texts follow. The five at
# 5e1f0a7: all RED. The whole table at ccda753: 59 rows, all RED (14 min).
# The R2 gate's fix round (2026-10-10): `--touched 7769cfd` at 9b99e31, 69 of 75 rows: 66 RED,
# `a_due_timer_waits_behind_the_publication` GREEN (an overdue grant is no longer starved by the
# publication alone: its row now targets a retry), `the_pump_drops_the_unsuback` WRONG-REASON (its
# earlier assertion sees the same guard: expected text follows), `an_overdue_grant_goes_on` HUNG (a
# due timer bypassing the select spun without yielding: fixed in 175904e). `--touched 9b99e31` at
# 175904e, 15 rows, and `the_pump_drops_the_unsuback`: all RED.
# The R2 confirming reviews' fix round (2026-10-10): 7 new rows, run as written (`--row`): 6 RED,
# `active_before_the_statuses_are_out` GREEN on two scenarios that cannot see it, RED on its own
# (see the row). `--touched 5e158de` at 8715a05, 68 of 82 rows (14 min): 65 RED,
# `a_republished_status_is_untagged` GREEN (its anchor was the fixed bridge's republish, no longer
# the host's), `the_publication_ignores_outstanding_requests` ANCHOR-MISS (the budget's line is the
# flush's too), `a_devices_reports_wake_nobody` WRONG-REASON (a later assertion sees the guard: its
# expected text follows); the three re-anchored or corrected: RED.

# ---- The pump ------------------------------------------------------------------------------------

# An UNSUBSCRIBE's packet id is forwarded as it is written: the host matches its UNSUBACK by it.
[[control]]
name        = "the_pump_drops_the_unsubscribes_packet_id"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''                Event::Outgoing(Outgoing::Unsubscribe(pkid)) => PumpEvent::Unsubscribing(pkid),
'''
replacement = ''''''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "--", "pump::tests::an_unsubscribe_and_its_unsuback_are_forwarded_with_their_packet_id", "--exact"]
expect_text = '''the UNSUBACK's packet id was not the UNSUBSCRIBE's'''
guard       = "pump_forwards_unsubscribing"

# The UNSUBACK is forwarded: a device's stop waits for its unsubscriptions before cleanup or a
# successor. (Without it the cleanup came, after the grant bound ended the session and the next one
# finished the stop: the scenario asserts no subscription_refused, 2026-10-10 run. Since the R2 gate's
# fix round the deferred cleanup is a sweep whose own UNSUBACKs are lost too, so it never comes: the
# earlier assertion sees the same guard, and the expected text follows it.)
[[control]]
name        = "the_pump_drops_the_unsuback"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''                Event::Incoming(Packet::UnsubAck(ack)) => PumpEvent::UnsubAck {'''
replacement = '''                Event::Incoming(Packet::UnsubAck(ack)) if ack.pkid == 0 => PumpEvent::UnsubAck {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "host_lifecycle", "--", "a_delete_clears_only_the_topics_this_process_tagged", "--exact"]
expect_text = '''the bridge's own tagged topics were not cleared'''
guard       = "pump_forwards_unsuback"

# ---- The reports and the mailbox -----------------------------------------------------------------

# Every device's reports wake the one session (§4.7). (Since the read grant's republish goes through
# the rotation, the answering device's `connected` gets out on the turns other work owes; the silent
# device's `unreachable`, reported with nothing else to do, is what waits for a wake: its assertion
# sees the guard now, 2026-10-10.)
[[control]]
name        = "a_devices_reports_wake_nobody"
file        = "mqtt-bridge-kit/src/lifecycle.rs"
anchor      = '''        let reports = Reports::with_ready(self.ready.clone());'''
replacement = '''        let reports = Reports::new();'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "host_devices", "--", "a_device_that_never_replies_leaves_the_other_answering", "--exact"]
expect_text = '''the device that never replies was not said unreachable'''
guard       = "shared_readiness"


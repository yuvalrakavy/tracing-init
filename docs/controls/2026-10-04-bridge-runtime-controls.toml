# Found by the read-back scenario: a state published before the first CONNACK's subscriptions overwrote the retained state the read-back reads.
[[control]]
name        = "reports_are_published_before_the_connack"
file        = "mqtt-bridge-kit/src/session.rs"
anchor      = '''        let step = if reported_last {
            // WAIT: session-events
            tokio::select! {
                biased;
                _ = shutdown.wait_for(|stop| *stop) => Step::Shutdown,
                event = incoming.recv() => Step::Event(event),
                () = shared.reports.reported(), if announced => Step::Reported,
            }
        } else {
            // WAIT: session-events
            tokio::select! {
                biased;
                _ = shutdown.wait_for(|stop| *stop) => Step::Shutdown,
                () = shared.reports.reported(), if announced => Step::Reported,
                event = incoming.recv() => Step::Event(event),
            }
        };'''
replacement = '''        let step = if reported_last {
            // WAIT: session-events
            tokio::select! {
                biased;
                _ = shutdown.wait_for(|stop| *stop) => Step::Shutdown,
                event = incoming.recv() => Step::Event(event),
                () = shared.reports.reported() => Step::Reported,
            }
        } else {
            // WAIT: session-events
            tokio::select! {
                biased;
                _ = shutdown.wait_for(|stop| *stop) => Step::Shutdown,
                () = shared.reports.reported() => Step::Reported,
                event = incoming.recv() => Step::Event(event),
            }
        };'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "requests", "--", "the_outage_conflict_after_a_bridge_restart_uses_the_read_back", "--exact"]

# Negative controls for the Bridge Runtime, R1 (tracing-init `mqtt-bridge-kit`, its conformance suite
# and the fake broker's additions; Bridge Runtime spec §5, §9). Each row undoes one guard and names
# the test that must fail, by its failure text. Run from Store with
#     CARGO_TARGET_DIR=<a scratch dir> python3 scripts/negative-control.py \
#         --root ../tracing-init docs/controls/2026-10-04-bridge-runtime-controls.toml
# (the root is the repository: a row's guard is in mqtt-bridge-kit, its test often in
# mqtt-bridge-conformance; give the table's path as an absolute one, or relative to Store).
# Every row must come back RED.
#
# Runs, on 2026-10-04: the first, 62 RED, 2 GREEN, 5 WRONG-REASON — the GREEN rows
# (`momentary_commands_wait_for_a_down_device`, `reads_are_queued_while_down`) could not tell a
# refusal at once from the next failed connect's purge, and now require the refusal's own message;
# two WRONG-REASON rows did not compile, three failed at an earlier assertion of the same guard.
# The second, after those fixes: all 69 RED (15 min).
#
# The R1 gate's fixes (branch `fix/r1-gate`, 2026-10-04): one row retired (the collision fix went
# with one connection per client), 55 added, others re-anchored. Most new and re-anchored rows were
# run in six batches as they were written: 66 RED, and 8 that were not — 4 GREEN (the test could
# not see the guard: retargeted, or a scenario added), 2 WRONG-REASON (a mutation that did not
# compile; a test that failed, intermittently, on messages that did not name the cause), 2
# ANCHOR-MISS (rustfmt had moved the text) — each fixed, and RED in the whole table's run, where
# the rest first ran. The whole table at 6c5a8a2: 119 RED, 2 GREEN, 2 WRONG-REASON
# (24 min): four older rows the fixes had left silent, repaired in 67824c5 (their comments say how)
# and RED on re-run. Every one of the 123 rows is RED.
#
# The R1 re-gate's fixes (F1-F3, R1-R18 and the minors, 2026-10-04..08): 47 rows added, many
# re-anchored, 170 in all; each new row run in a batch as it was written. Whole-table runs:
# at 6465800, 165 RED, 4 GREEN, 1 WRONG-REASON (rows the later fixes had left silent, repaired in
# 435f884); at 435f884, 168 RED, 2 GREEN (two rows that timing made GREEN, made deterministic in
# ddf2118 and cc7ef90); at cc7ef90, 169 RED, 1 WRONG-REASON (the stalled-broker fixture did not
# always park the session; fixed in c968936, and its three rows RED three times over). Every one
# of the 170 rows is RED.
#
# The third re-gate's fixes (S1-S7, 2026-10-08..09): the restore's seven rows removed with its
# machinery, 13 added, others re-anchored; 176 in all, each new row run as it was written.
# Whole-table runs: at dc99067, 173 RED, 2 GREEN (`a_failed_poll_takes_the_next_work`, which
# S3's in-flight refusal had made silent, now told apart by the refusal's wording; and
# `a_pause_is_a_dead_worker`, a race in a process test, now a unit test of the tick's judgment —
# both in 6d8f0e1). At 6d8f0e1: 98 RED, then 78 WRONG-REASON when a scratch-directory cleanup
# deleted the controls checkout mid-run; those 78 rows, with the rebound
# `a_restore_is_never_unproven`, re-run at f3208c3 (same code): all RED. Every one of the 176
# rows is RED.
#
# The fourth re-gate's fixes (F1-F6 and the minors, 2026-10-09): 12 rows added, 9 re-anchored, 188
# in all. The new and re-anchored rows first as a batch at 2ad7414: 20 RED. The whole table at
# 2ad7414: 187 RED, 1 ANCHOR-MISS (`a_retraction_leaves_the_assumption_unproven`, whose line minor
# 7 moved one level deeper; re-anchored in 2816b96, RED). Every one of the 188 rows is RED.
#
# The fifth re-gate's fixes (G1, G2 and the minors, 2026-10-09): 7 rows added, 5 re-anchored, 1
# retargeted; 195 in all. The batch at 860e81b: 12 RED, 1 WRONG-REASON (`a_finished_verdict_is_
# aborted` failed on the stop's bound, the right guard: its expect text fixed in 46749cc, RED).
# The whole table at 46749cc: 194 RED, 1 GREEN (`a_command_cut_off_is_answered_again` still
# mutated `command_done`, which the worker no longer calls: retargeted to `command_done_then`,
# RED). Every one of the 195 rows is RED.
#
# The final gate (Codex; 2026-10-09): the restore removed from R1, its 17 rows with it; 5 rows
# added, 9 re-anchored, 1 retargeted; 183 in all. The batch at def8915: 14 RED. The whole table at
# def8915: 182 RED, 1 GREEN (`the_flush_drops_what_is_pending`: its scenario saw a refusal, and
# the stop's refusals now go out apart from the pending reports; retargeted in 1783331 to a test of
# the flush itself, RED). Every one of the 183 rows is RED.
#
# Failing first, beyond these rows: the read-back scenario
# (`the_outage_conflict_after_a_bridge_restart_uses_the_read_back`) failed against the first
# build — "no Error said the request was superseded: []" — because the session published the
# device's state before its first CONNACK's subscriptions, overwriting the retained state the
# read-back reads; the row `reports_are_published_before_the_connack` undoes that fix.

# The forward queue's high-water WARN (`mqtt_backlog_high`).
[[control]]
name        = "the_backlog_never_flags_high_water"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''if depth >= HIGH_WATER && self.high_since'''
replacement = '''if depth >= usize::MAX && self.high_since'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "--", "pump::tests::a_backlog_past_high_water_is_flagged_once_and_cleared_when_it_drains", "--exact"]
expect_text = '''not flagged at the high-water mark'''
guard       = "pump_backlog_episode"

# A bounded forward: the pump waits on a session parked on the request channel only the pump drains.
[[control]]
name        = "the_pump_waits_on_the_session"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''                Event::Incoming(Packet::Publish(publish)) => {
                    backlog.pushed();
                    PumpEvent::Publish(publish, Instant::now())
                }'''
replacement = '''                Event::Incoming(Packet::Publish(publish)) => {
                    backlog.pushed();
                    while backlog.depth.load(Ordering::SeqCst) > 10 {
                        tokio::time::sleep(Duration::from_millis(1)).await;
                    }
                    PumpEvent::Publish(publish, Instant::now())
                }'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "stalled_broker", "--", "the_device_side_works_while_the_broker_is_stalled", "--exact"]
expect_text = '''the pump waits on the session'''
guard       = "pump_never_waits"


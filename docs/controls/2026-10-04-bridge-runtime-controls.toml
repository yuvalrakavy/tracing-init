            let value = f();'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "--", "link::tests::a_blocking_call_whose_future_is_dropped_stays_counted_until_its_thread_ends", "--exact"]
expect_text = '''a dropped call whose thread still runs was not counted'''
guard       = "blocking_slot_raii"


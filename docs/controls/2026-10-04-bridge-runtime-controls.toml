# C1: a broker that answers PINGREQ but withholds its acknowledgements ends the session.
[[control]]
name        = "the_pump_lets_requests_stand_unacknowledged"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''            (true, None) => Some(Instant::now()),'''
replacement = '''            (true, None) => None,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "--", "pump::tests::a_broker_that_acknowledges_nothing_ends_the_session_within_twice_the_keep_alive", "--exact"]
expect_text = '''the pump went on for 20 s with a publish its broker never acknowledged'''
guard       = "mqtt_ack_progress"

# C1: one poll is bounded (a broker that stops reading holds rumqttc in its flush).
[[control]]
name        = "the_pump_lets_a_poll_run_unbounded"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''                None => polled_at + stall,'''
replacement = '''                None => polled_at + Duration::from_secs(3600),'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-kit/Cargo.toml", "--lib", "--", "pump::tests::a_poll_that_does_not_return_ends_the_session_within_twice_the_keep_alive", "--exact"]
expect_text = '''the pump's poll did not return for 20 s with the broker not reading'''
guard       = "mqtt_poll_bound"

# MINOR 14: each connection a fresh client, so nothing queued in one goes out ahead of the next CONNACK's subscriptions.
[[control]]
name        = "the_pump_reconnects_inside_its_event_loop"
file        = "mqtt-bridge-kit/src/pump.rs"
anchor      = '''                Ok(Err(e)) => return end(e.to_string()),'''
replacement = '''                Ok(Err(e)) => {
                    outage.failed(&e.to_string());
                    tokio::time::sleep(Duration::from_millis(100)).await;
                    continue;
                }'''
target      = "command"
argv        = ["cargo", "test", "-q", "--manifest-path", "mqtt-bridge-conformance/Cargo.toml", "--test", "reconnects", "--", "a_reconnect_publishes_nothing_before_its_subscriptions", "--exact"]
expect_text = '''something went out before the subscriptions on the reconnect'''
guard       = "fresh_client_per_connection"

